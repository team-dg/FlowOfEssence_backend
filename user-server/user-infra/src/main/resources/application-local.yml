spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://${local-db.postgres.host}:${local-db.postgres.port}/${local-db.postgres.name}
      username: ${local-db.postgres.username}
      password: ${local-db.postgres.password}

  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        hbm2ddl.auto: create
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: true

eventuatelocal:
  kafka:
    bootstrap:
      servers: localhost:9092
  zookeeper:
    connection:
      string: localhost:2181

eventuate:
  outbox:
    id: 2
  database:
    schema: eventuate
  tram:
    saga:
      participant:
        enabled: true
      enabled: true
    messaging:
      enabled: true
      producer:
        properties:
          max.request.size: 10485760
          auto.create.topics.enable: true
          acks: all
          retries: 5
          enable.idempotence: true
          max.in.flight.requests.per.connection: 5
      consumer:
        properties:
          max.poll.records: 100
          max.poll.interval.ms: 300000
          session.timeout.ms: 30000
          heartbeat.interval.ms: 10000
          auto.commit.interval.ms: 100
          partition.assignment.strategy: org.apache.kafka.clients.consumer.RoundRobinAssignor
        group-id: userService
        auto-offset-reset: latest
        enable-auto-commit: true
        id: userService
      destinations:
        userService:
          destination: userService
          dlq:
            destination: userService-dlq
        authenticationService:
          destination: authenticationService
          dlq:
            destination: authenticationService-dlq
    kafka:
      message:
        serializer: io.eventuate.messaging.kafka.basic.consumer.DefaultKafkaMessageSerializer
        deserializer: io.eventuate.messaging.kafka.basic.consumer.DefaultKafkaMessageDeserializer
      properties:
        security.protocol: PLAINTEXT
    events:
      publisher:
        enabled: true
      subscriber:
        enabled: true
        id: userService
        group-id: userService

api:
  uri: http://localhost:6011

logging:
  level:
    org:
      hibernate:
        type: info
        level: info
    io:
      eventuate: DEBUG
      eventuate.tram: TRACE
    com.lolclone.userinfra: DEBUG
