spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://${local-db.postgres.host}:${local-db.postgres.port}/${local-db.postgres.name}
      username: ${local-db.postgres.username}
      password: ${local-db.postgres.password}

  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        hbm2ddl.auto: update
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: true

eventuatelocal:
  kafka:
    bootstrap:
      servers: localhost:9091,localhost:9092,localhost:9093
  zookeeper:
    connection:
      string: localhost:12181,localhost:22181,localhost:32181

eventuate:
  database:
    schema: eventuate
  tram:
    messaging:
      enabled: true
      producer:
        properties:
          max.request.size: 10485760
          auto.create.topics.enable: true
          acks: all
          retries: 5
          enable.idempotence: true
          max.in.flight.requests.per.connection: 5
      consumer:
        properties:
          max.poll.records: 100
          max.poll.interval.ms: 300000
        group-id: ${spring.application.name}
        auto-offset-reset: earliest
    kafka:
      properties:
        security.protocol: PLAINTEXT

channel:
  prefix: lol
  version: v1
  userService: user-service

api:
  uri: http://localhost:6011

logging:
  level:
    org:
      hibernate:
        type: info
        level: info
    io:
      eventuate: DEBUG
      eventuate.tram: TRACE
